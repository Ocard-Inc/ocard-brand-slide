<title>Ocard 圖表總覽</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root{--bg:#F2F2F2;--surface:#FFFFFF;--text:#333333;--muted:#8A8A8A;--line:#E8E8E8;--chip:#333333;--chip-text:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1A1A;--surface:#262626;--text:#F2F2F2;--muted:#ADADAD;--line:#3D3D3D;--chip:#F2F2F2;--chip-text:#1A1A1A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A1A1A;--surface:#262626;--text:#F2F2F2;--muted:#ADADAD;--line:#3D3D3D;--chip:#F2F2F2;--chip-text:#1A1A1A;color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:'Montserrat','Noto Sans TC',system-ui,sans-serif;padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:1440px;margin:0 auto}
header h1{font-size:28px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:15px;line-height:1.6;max-width:70ch}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 28px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:2}
.tabs button{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--chip);color:var(--chip-text);border-color:var(--chip)}
.type{margin:0 0 40px}
.type h2{font-size:20px;margin:0 0 4px;font-weight:800}
.type .use{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.6}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.row{grid-template-columns:1fr}}
.cell .lab{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.frame>.slide{position:absolute;left:0;top:0;transform-origin:0 0}
.slide{width:1280px;height:720px;box-sizing:border-box;padding:64px;font-family:'Montserrat','Noto Sans TC',sans-serif;position:relative;overflow:hidden}
.slide .tag{font-size:15px;font-weight:700;line-height:1.4;letter-spacing:.14em}
.slide h3{margin:14px 0 0;font-size:42px;font-weight:800;letter-spacing:-.02em;line-height:1.18}
.slide .bar{height:6px;width:72px;border-radius:999px;margin-top:18px}
.slide[data-g="white"]{background:#FFFFFF;color:#333333}.slide[data-g="white"] .tag{color:#ADADAD}.slide[data-g="white"] .bar{background:#FFEA00}
.slide[data-g="ink"]{background:#333333;color:#FFFFFF}.slide[data-g="ink"] .tag{color:rgba(255,255,255,.58)}.slide[data-g="ink"] .bar{background:#FFEA00}
.slide[data-g="hexgeo"]{background:#FFFFFF;color:#333333}.slide[data-g="hexgeo"] .tag{color:#FC6815}.slide[data-g="hexgeo"] .bar{display:none}
.slide[data-g="hexgeo"] h3{font-size:46px}
.slide .hx{position:absolute;right:-60px;top:-70px;width:260px;height:260px;opacity:.9}
.slide [data-chart]{position:absolute}
</style>

<div class="wrap">
<header>
<h1>Ocard 圖表總覽</h1>
<p>同一份資料、同一套圖表程式，套上三個版型的外觀：白底標準、墨底標準、六角幾何拼貼。每張圖只有一個重點用輔助色，其餘是淡底；只有分類不同時（甜甜圈、堆疊）才多色。</p>
</header>
<nav class="tabs" id="tabs"></nav>
<div id="list"></div>
</div>

<!--CHARTS-JS-->
<script>
var HEX='<svg class="hx" viewBox="0 0 100 100"><path d="M50 4 90 27 90 73 50 96 10 73 10 27Z" fill="#FFE8DC" stroke="#FFE8DC" stroke-width="6" stroke-linejoin="round"/><path d="M78 52 96 62 96 83 78 93 60 83 60 62Z" fill="#B287FD" stroke="#B287FD" stroke-width="3" stroke-linejoin="round"/></svg>';
var M=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
var TYPES=[
 {t:'kpi',name:'KPI 小趨勢',use:'一個數字＋漲跌＋小趨勢線。適合儀表板式的 2–4 張卡並排。',tag:'會員經營 · 近 12 個月',h:'三項指標同步成長',multi:[
   {type:'kpi',value:'24,693',delta:12.4,deltaLabel:'較去年',label:'活躍會員數',trend:[14,15,15,17,16,18,19,19,21,22,23,24.7]},
   {type:'kpi',value:'38%',delta:5.1,deltaLabel:'較去年',label:'回購率',trend:[30,31,30,32,33,33,34,35,36,36,37,38],accent:'teal'},
   {type:'kpi',value:'2,010',delta:-3.2,deltaLabel:'較去年',label:'客單價（元）',trend:[2120,2100,2090,2080,2070,2060,2050,2040,2030,2030,2020,2010],accent:'purple'}]},
 {t:'line',name:'折線／面積',use:'看趨勢。平滑曲線＋淡面積，最後一點標數字；可加一條灰色虛線做對照（如去年）。',tag:'營收 · 2026',h:'下半年營收明顯拉開',spec:{type:'line',smooth:true,labels:M,values:[310,330,320,360,380,370,410,450,470,520,560,610],compare:{name:'去年',values:[290,300,295,310,320,315,330,340,350,360,370,380]},unit:' 萬'}},
 {t:'bar',name:'直向長條',use:'比較幾個類別的大小；一根用輔助色標出重點，其他淡底。',tag:'年齡層 × 客貢獻',h:'客貢獻隨年齡遞增，60 歲以上最高',spec:{type:'bar',labels:['19-22','23-29','30-39','40-49','50-59','60+'],values:[1157,1648,2010,2180,2340,2510],highlight:5,accent:'teal'}},
 {t:'hbar',name:'橫向長條',use:'類別名稱較長或項目較多時（排名）。',tag:'門市排名 · 9 月',h:'前三名門市貢獻四成營收',spec:{type:'hbar',labels:['信義旗艦店','南西店','台中勤美','高雄巨蛋','新竹巨城'],values:[182,164,141,118,96],highlight:0,unit:' 萬'}},
 {t:'stacked',name:'堆疊長條',use:'每根長條拆成幾個分類（新客／回購）。這裡的多色代表不同分類。',tag:'客群組成 · 季度',h:'回購客佔比逐季上升',spec:{type:'stacked',labels:['Q1','Q2','Q3','Q4'],series:[{name:'回購客',values:[820,960,1120,1310]},{name:'新客',values:[640,610,590,570]}]}},
 {t:'donut',name:'甜甜圈',use:'整體的組成比例，最多 4 類；中間放總數。',tag:'消費通路',h:'六成消費發生在門市',spec:{type:'donut',labels:['門市','線上商城','外送平台','其他'],values:[61,24,11,4],center:'100%',centerLabel:'總消費額'}},
 {t:'progress',name:'分段進度',use:'一個百分比的達成度（目標達成、滲透率）。',tag:'年度目標',h:'會員綁定率已達 72%',spec:{type:'progress',value:72,segments:25,caption:'目標 85%，還差 13 個百分點'}},
 {t:'funnel',name:'漏斗',use:'一步步的轉換（觸及 → 開啟 → 點擊 → 消費），右側是到下一步的轉換率。',tag:'簡訊活動轉換',h:'點擊到消費是最大的流失點',spec:{type:'funnel',labels:['發送','開啟','點擊','到店消費'],values:[12000,8400,3100,940],highlight:3}},
 {t:'heatmap',name:'熱度表',use:'兩個維度交叉（星期 × 時段），顏色越深越多；最高的一格實色。',tag:'來客時段',h:'週六午後是來客高峰',spec:{type:'heatmap',rows:['一','二','三','四','五','六','日'],cols:['10','12','14','16','18','20'],values:[[12,30,18,15,28,20],[10,28,16,14,30,22],[11,29,17,16,31,24],[13,31,19,17,33,26],[15,34,22,21,42,38],[30,52,68,60,48,35],[28,50,55,46,40,25]]}},
 {t:'timeline',name:'時間軸',use:'專案或導入進度：完成、進行中、未開始。',tag:'導入時程',h:'目前進行到會員資料串接',spec:{type:'timeline',items:[{date:'9 月 2 日',title:'簽約與需求訪談',text:'確認門市數、POS 系統與會員規則',state:'done'},{date:'9 月 16 日',title:'會員資料串接',text:'舊會員匯入、POS 對接測試',state:'now'},{date:'10 月 7 日',title:'店員教育訓練',state:'next'},{date:'10 月 21 日',title:'正式上線',state:'next'}]}}
];
var G=[['white','白底標準'],['ink','墨底標準'],['hexgeo','六角幾何拼貼']];
function box(spec,l,t,w,h){return '<div data-chart style="left:'+l+'px;top:'+t+'px;width:'+w+'px;height:'+h+'px"><script type="application/json">'+JSON.stringify(spec)+'<\/script></div>';}
function slide(d,g){
  var top=g==='hexgeo'?250:260,o='<div class="slide" data-g="'+g+'">'+(g==='hexgeo'?HEX:'')+'<div class="tag">'+d.tag+'</div><h3>'+d.h+'</h3><div class="bar"></div>';
  if(d.multi){var w=(1280-128-2*48)/3;d.multi.forEach(function(s,i){o+=box(s,64+i*(w+48),top,w,360);});}
  else if(d.t==='timeline')o+=box(d.spec,64,top-10,720,400);
  else if(d.t==='progress')o+=box(d.spec,64,top+20,1152,260);
  else if(d.t==='donut')o+=box(d.spec,64,top,820,340);
  else o+=box(d.spec,64,top,1152,360);
  return o+'</div>';
}
var tabs=document.getElementById('tabs'),list=document.getElementById('list');
tabs.innerHTML='<button aria-pressed="true" data-f="">全部</button>'+TYPES.map(function(d){return '<button aria-pressed="false" data-f="'+d.t+'">'+d.name+'</button>';}).join('');
list.innerHTML=TYPES.map(function(d){return '<section class="type" id="'+d.t+'" data-t="'+d.t+'"><h2>'+d.name+'</h2><p class="use">'+d.use+'</p><div class="row">'+G.map(function(g){return '<div class="cell"><p class="lab">'+g[1]+'</p><div class="frame">'+slide(d,g[0])+'</div></div>';}).join('')+'</div></section>';}).join('');
function fit(){document.querySelectorAll('.frame').forEach(function(f){f.firstChild.style.transform='scale('+f.clientWidth/1280+')';});}
function draw(){document.querySelectorAll('.slide').forEach(function(s){OcardCharts.render(s,s.getAttribute('data-g'));});}
tabs.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;tabs.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b);});var f=b.getAttribute('data-f');list.querySelectorAll('.type').forEach(function(s){s.hidden=!!f&&s.getAttribute('data-t')!==f;});fit();});
addEventListener('resize',fit);fit();draw();
if(document.fonts)document.fonts.ready.then(draw);
</script>
