<!-- @dsCard group="Colors" viewport="820x230" name="Ink-only accent" subtitle="墨底輔助色 — 僅限墨色版（#333333 底）使用" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:var(--font-sans);background:#333333;color:#FFFFFF;padding:20px 24px}.sw{flex:1}.chip{height:64px;border-radius:var(--radius-sm)}.nm{margin-top:8px;font-size:12px;font-weight:600}.hx{font-size:11px;color:rgba(255,255,255,.58);font-family:var(--font-mono)}.pill{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:700;line-height:1}</style></head><body><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span style="font-size:12px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:4px;background:#FFEA00;color:#333333">僅限墨色版</span><span style="font-size:12px;color:rgba(255,255,255,.58)">白底、灰底不得使用 — 改用標準輔助色</span></div><div style="display:flex;gap:14px"><div class="sw"><div class="chip" style="background:#FF7A2E"></div><div class="nm">Ink orange</div><div class="hx">--oc-ink-orange · #FF7A2E</div></div><div class="sw"><div class="chip" style="background:#CDAEFF"></div><div class="nm">Ink purple</div><div class="hx">--oc-ink-purple · #CDAEFF</div></div><div class="sw"><div class="chip" style="background:#6ED6CA"></div><div class="nm">Ink teal</div><div class="hx">--oc-ink-teal · #6ED6CA</div></div></div><div style="display:flex;gap:12px;margin-top:18px"><span class="pill" style="box-shadow:inset 0 0 0 1.33px #FF7A2E;color:#FF7A2E">餐飲</span><span class="pill" style="box-shadow:inset 0 0 0 1.33px #CDAEFF;color:#CDAEFF">零售</span><span class="pill" style="box-shadow:inset 0 0 0 1.33px #6ED6CA;color:#6ED6CA">美業</span></div></body></html>
