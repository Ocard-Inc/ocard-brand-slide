<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:var(--font-sans);color:var(--text-primary);padding:20px 24px}</style></head><body><div style="display:flex;align-items:center;gap:32px"><div style="display:flex;gap:18px"><div style="text-align:center"><div style="padding:22px;border:1px dashed var(--border-strong);border-radius:12px"><img src="../assets/logos/ocard-mark.svg" style="height:64px;display:block"></div><div style="font-size:11px;margin-top:8px;font-weight:600">Ocard</div></div><div style="text-align:center"><div style="padding:22px;border:1px dashed var(--border-strong);border-radius:12px"><img src="../assets/logos/ofb-mark.svg" style="height:64px;display:block"></div><div style="font-size:11px;margin-top:8px;font-weight:600">for Business</div></div></div><div style="font-size:13px;line-height:1.85;color:var(--text-secondary)"><div><strong style="color:var(--text-primary)">Clear space</strong> — ≥ the mark's own height on every side</div><div><strong style="color:var(--text-primary)">Min size</strong> — 20px tall (horizontal) / 32px (vertical)</div><div><strong style="color:var(--text-primary)">Interior</strong> — Ocard 為 #333333 傾斜卡片；OFB 為白色立方體，三面不透明度 100% / 75% / 50% 疊在品牌黃六邊形上（勿壓平成實色）</div><div><strong style="color:var(--text-primary)">Never</strong> — recolour, outline, rotate or add effects</div></div></div></body></html>
