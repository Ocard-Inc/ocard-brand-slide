<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<style>
/* Single light look on purpose: the choices are previews of white-ground slides */
:root{
  color-scheme:light;
  --ink:#333333;--ink-2:#5C5C5C;--muted:#8A8A8A;--light:#ADADAD;
  --line:#E8E8E8;--line-2:#D6D6D6;--sunken:#FAFAFA;--tile:#F2F2F2;
  --yellow:#FFEA00;--yellow-tint:#FFF8C8;--page:#FFFFFF;
  --font:"Montserrat","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:40px 140px;display:flex;flex-direction:column;gap:40px}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--light)}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.rule{height:5px;width:64px;background:var(--yellow);border-radius:999px}
.lead{margin:0;color:var(--ink-2);max-width:62ch}
.fixed{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.fixed .sw{flex:0 0 auto;width:44px;height:28px;border-radius:6px;background:#FFFFFF;box-shadow:inset 0 0 0 1px var(--line-2)}
.fixed b{font-weight:700}
.fixed span{color:var(--ink-2);font-size:14px}
.q{display:flex;flex-direction:column;gap:14px}
.qh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.qn{font-size:14px;font-weight:700;color:var(--light);font-variant-numeric:tabular-nums}
.qh h2{margin:0;font-size:20px;font-weight:700}
.qh p{margin:0;font-size:14px;color:var(--ink-2)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.opt{font:inherit;color:inherit;text-align:left;border:0;background:#FFFFFF;border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow 120ms cubic-bezier(.2,0,0,1)}
.opt:hover{box-shadow:inset 0 0 0 1px var(--line-2)}
.opt:focus-visible{outline:1px solid var(--ink);box-shadow:0 0 0 3px var(--yellow-tint),inset 0 0 0 1px var(--ink)}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.pic{display:block;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);background:#FFFFFF}
.pic svg{display:block;width:100%;height:auto}
.nm{display:flex;align-items:center;gap:8px;font-size:15px}
.lt{font-size:12px;font-weight:700;background:var(--ink);color:var(--yellow);border-radius:4px;padding:2px 6px;line-height:1.3}
.dft{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-2);padding:2px 7px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-2);margin-left:auto}
.ds{font-size:13px;line-height:1.55;color:var(--ink-2)}
.q .off-note{display:none;margin:0;font-size:13px;color:var(--ink-2);padding:10px 12px;border-radius:8px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.q.off .off-note{display:block}
.q.off .opts{opacity:.35;pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#FFFFFF;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:1080px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sum{flex:1 1 360px;font-size:13px;line-height:1.6;color:var(--ink-2);min-width:0}
.sum b{color:var(--ink);font-weight:700}
.btn{font:inherit;font-size:15px;font-weight:700;height:44px;padding:0 20px;border-radius:999px;border:0;cursor:pointer;transition:transform 120ms cubic-bezier(.2,0,0,1)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:1px solid var(--ink);box-shadow:0 0 0 3px var(--yellow-tint)}
.btn-ink{background:var(--ink);color:#FFFFFF}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.copied{font-size:13px;font-weight:700;color:var(--ink)}
textarea{display:block;width:100%;margin-top:8px;font:inherit;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line-2);resize:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">STEP 2 · 六角幾何拼貼</span>
    <h1>選一款封面</h1>
    <div class="rule"></div>
    <p class="lead">六角幾何拼貼只需要決定封面。<b>這一頁用來看示意，請在對話裡點選同一題並按確認</b>，Claude 就會開始做簡報，這個視窗可以關掉。完整的版面規則見 <code>style-hexgeo.board.html</code>。</p>
  </header>
  <div class="fixed"><span class="sw" aria-hidden="true" style="background:#FAFAFA"></span><div><b>其他設定直接套用預設</b><br><span>輔助色、編號、小標記號、圖示和照片，產出後都能在簡報的「調整」面板裡改。</span></div></div>
<section class="q" id="q-hcover"><div class="qh"><h2>封面樣式</h2><p>六角幾何拼貼的第一頁</p></div><div class="opts"><button class="opt" type="button" data-q="hcover" data-v="六角膠囊拼貼" aria-pressed="false"><span class="pic"><svg viewBox="0 0 200 112" aria-hidden="true"><rect width="200" height="112" fill="#FAFAFA"/><rect x="-8" y="0" width="26" height="112" rx="8" fill="#FFFFFF"/><polygon points="12.6,12.1 9.0,14.2 5.4,12.1 5.4,7.9 9.0,5.8 12.6,7.9" fill="#FFEA00" stroke="#FFEA00" stroke-width="1.2" stroke-linejoin="round"/><rect x="32" y="40" width="54" height="9" rx="2" fill="#333333"/><rect x="32" y="53" width="40" height="9" rx="2" fill="#333333"/><polygon points="79.1,58.2 77.0,59.4 74.9,58.2 74.9,55.8 77.0,54.6 79.1,55.8" fill="#FFEA00" stroke="#FFEA00" stroke-width="0.7" stroke-linejoin="round"/><rect x="32" y="70" width="52" height="3" rx="1.5" fill="#ADADAD"/><polygon points="124.0,40.0 136.0,46.9 136.0,85.1 124.0,92.0 112.0,85.1 112.0,46.9" fill="#F2F2F2" stroke="#F2F2F2" stroke-width="3" stroke-linejoin="round"/><polygon points="154.0,10.0 166.0,16.9 166.0,49.1 154.0,56.0 142.0,49.1 142.0,16.9" fill="#E8E8E8" stroke="#E8E8E8" stroke-width="3" stroke-linejoin="round"/><polygon points="154.0,62.0 166.0,68.9 166.0,111.1 154.0,118.0 142.0,111.1 142.0,68.9" fill="#333333" stroke="#333333" stroke-width="3" stroke-linejoin="round"/><polygon points="184.0,30.0 196.0,36.9 196.0,73.1 184.0,80.0 172.0,73.1 172.0,36.9" fill="#FFEA00" stroke="#FFEA00" stroke-width="3" stroke-linejoin="round"/></svg></span><span class="nm"><b class="lt">A</b><b>六角膠囊拼貼</b><i class="dft">預設</i></span><span class="ds">淺灰底，右側直向六角膠囊拼貼，明亮</span></button><button class="opt" type="button" data-q="hcover" data-v="墨色滿版" aria-pressed="false"><span class="pic"><svg viewBox="0 0 200 112" aria-hidden="true"><rect width="200" height="112" fill="#333333"/><rect x="-8" y="0" width="26" height="112" rx="8" fill="#FFFFFF"/><polygon points="12.6,12.1 9.0,14.2 5.4,12.1 5.4,7.9 9.0,5.8 12.6,7.9" fill="#FFEA00" stroke="#FFEA00" stroke-width="1.2" stroke-linejoin="round"/><polygon points="39.0,-14.0 50.0,-7.6 50.0,19.6 39.0,26.0 28.0,19.6 28.0,-7.6" fill="#FFEA00" stroke="#FFEA00" stroke-width="3" stroke-linejoin="round"/><polygon points="65.5,43.5 56.0,49.0 46.5,43.5 46.5,32.5 56.0,27.0 65.5,32.5" fill="#FFEA00" stroke="#FFEA00" stroke-width="3.1" stroke-linejoin="round"/><polygon points="38.9,44.0 32.0,48.0 25.1,44.0 25.1,36.0 32.0,32.0 38.9,36.0" fill="#4A4A4A" stroke="#4A4A4A" stroke-width="2.2" stroke-linejoin="round"/><polygon points="126.0,30.0 138.7,8.0 175.3,8.0 188.0,30.0 175.3,52.0 138.7,52.0" fill="#4A4A4A" stroke="#4A4A4A" stroke-width="3" stroke-linejoin="round"/><rect x="86" y="66" width="62" height="9" rx="2" fill="#FFFFFF"/><rect x="86" y="79" width="50" height="9" rx="2" fill="#FFFFFF"/><polygon points="143.1,85.2 141.0,86.4 138.9,85.2 138.9,82.8 141.0,81.6 143.1,82.8" fill="#FFEA00" stroke="#FFEA00" stroke-width="0.7" stroke-linejoin="round"/></svg></span><span class="nm"><b class="lt">B</b><b>墨色滿版</b></span><span class="ds">墨色底，左上六角拼貼、右上六角照片，大標題在右下，沉穩有份量</span></button></div></section>

</div>

<div class="bar">
  <div class="bar-in">
    <div class="sum" id="sum" aria-live="polite"></div>
    <button class="btn btn-ghost" id="auto" type="button">都交給你決定</button>
    <button class="btn btn-ghost" id="copy" type="button" hidden>複製文字</button>
    <button class="btn btn-ink" id="ok" type="button">確認選擇</button>
  </div>
  <div class="bar-in" id="done" hidden><p class="copied" id="done-msg" style="margin:6px 0 0"></p></div>
  <div class="bar-in" id="fallback" hidden><textarea id="out" rows="2" readonly aria-label="我的選擇"></textarea></div>
</div>

<script>
(function(){
  /* a question that does not apply because of another answer, e.g. no corners to round on borderless columns */
  var OFF={radius:{q:'card',v:'無框分欄',note:'卡片外觀選了「無框分欄」，內容沒有外框、沒有轉角，所以不用選圓角。'}};
  var META=[{"id": "hcover", "title": "封面樣式", "default": "六角膠囊拼貼", "labels": ["六角膠囊拼貼", "墨色滿版"]}], KEY='ocard-hexgeo-picker', sel={}, confirmed=false, db=null, ref=null, timer=null;
  try{sel=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){sel={};}
  var ok=document.getElementById('ok'),copyBtn=document.getElementById('copy'),done=document.getElementById('done'),doneMsg=document.getElementById('done-msg');
  function letter(q,v){return 'ABCDEFG'[q.labels.indexOf(v)];}
  function text(){
    return '六角幾何拼貼：'+META.map(function(q){
      if(isOff(q.id))return q.title+' 不適用';
      var v=sel[q.id];return q.title+' '+(v?letter(q,v)+' '+v:'交給你（預設 '+q.default+'）');
    }).join('｜');
  }
  /* the choices are written to the artifact's data store so Claude can read them back */
  function push(){
    try{localStorage.setItem(KEY,JSON.stringify(sel));}catch(e){}
    if(!ref)return;
    clearTimeout(timer);
    timer=setTimeout(function(){
      ref.set({sel:sel,summary:text(),confirmed:confirmed,updatedAt:Date.now()}).catch(function(){showCopy();});
    },confirmed?0:500);
  }
  function showCopy(){copyBtn.hidden=false;}
  function isOff(id){var o=OFF[id];return !!(o&&sel[o.q]===o.v);}
  function render(){
    Object.keys(OFF).forEach(function(id){
      var sec=document.getElementById('q-'+id);if(!sec)return;
      if(!sec.querySelector('.off-note')){var n=document.createElement('p');n.className='off-note';n.textContent=OFF[id].note;sec.querySelector('.qh').after(n);}
      var off=isOff(id);sec.classList.toggle('off',off);
      sec.querySelectorAll('.opt').forEach(function(b){b.disabled=off;});
      if(off)delete sel[id];
    });
    document.querySelectorAll('.opt').forEach(function(b){b.setAttribute('aria-pressed',sel[b.dataset.q]===b.dataset.v?'true':'false');});
    var live=META.filter(function(q){return !isOff(q.id);}),n=live.filter(function(q){return sel[q.id];}).length;
    document.getElementById('sum').innerHTML='<b>已選 '+n+' / '+live.length+' 題</b>　'+text().replace('六角幾何拼貼：','');
    ok.textContent=confirmed?'已確認':'確認選擇';
    done.hidden=!confirmed;
    if(confirmed)copyBtn.hidden=false;
    doneMsg.textContent=ref?'已確認並同步。回到對話說一聲「選好了」即可；如果 Claude 說讀不到，按「複製文字」貼回對話。想改就重新點選再按確認。':'已確認。這個檢視無法自動同步，請按「複製文字」貼回對話。';
  }
  document.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click',function(){var q=b.dataset.q;if(sel[q]===b.dataset.v)delete sel[q];else sel[q]=b.dataset.v;confirmed=false;push();render();});
  });
  document.getElementById('auto').onclick=function(){sel={};confirmed=true;push();render();};
  ok.onclick=function(){confirmed=true;push();render();if(!ref)showCopy();};
  function fallback(){var f=document.getElementById('fallback'),o=document.getElementById('out');f.hidden=false;o.value=text();o.focus();o.select();}
  copyBtn.onclick=function(){
    try{navigator.clipboard.writeText(text()).then(function(){copyBtn.textContent='已複製';},fallback);}catch(e){fallback();}
  };
  render();
  if(window.claude&&window.claude.use){
    window.claude.use('db').then(function(d){
      if(!d){showCopy();return;}
      db=d;ref=db.doc('picks/hexgeo');
      ref.get().then(function(snap){
        if(snap.exists){var v=snap.data()||{};if(v.sel&&!Object.keys(sel).length)sel=Object.assign({},v.sel);confirmed=!!v.confirmed;render();}
      }).catch(function(){});
      render();
    }).catch(showCopy);
  }else showCopy();
})();
</script>
