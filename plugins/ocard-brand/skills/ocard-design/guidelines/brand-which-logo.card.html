<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:var(--font-sans);color:var(--text-primary);padding:20px 24px}td,th{padding:9px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--oc-gray-100);vertical-align:top}th{font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:.04em}</style></head><body><table style="width:100%;border-collapse:collapse"><tr><th style="width:132px"></th><th>Ocard（B2C）</th><th>Ocard for Business（B2B）</th></tr>
<tr><td style="font-weight:600">對象</td><td>一般消費者、會員</td><td>品牌／店家、企業客戶</td></tr>
<tr><td style="font-weight:600">使用場景</td><td>會員卡、集點與票券、消費者 App、門市活動物料、對會員的行銷素材</td><td>商家後台介面、業務銷售簡報、產品說明會、合作提案、招商文件</td></tr>
<tr><td style="font-weight:600">Mark 內部</td><td>墨黑傾斜卡片</td><td>白色立方體（100% / 75% / 50% 不透明度）</td></tr>
<tr><td style="font-weight:600">檔名前綴</td><td><code style="font-family:var(--font-mono);font-size:12px">ocard-*</code></td><td><code style="font-family:var(--font-mono);font-size:12px">ofb-*</code></td></tr>
<tr><td style="font-weight:600">切勿</td><td colspan="2">混用兩套標誌於同一份文件；對消費者出現 for Business 字樣；商家簡報只放消費者版標誌</td></tr>
</table></body></html>
