<!-- @dsCard group="Icons" viewport="700x300" name="圖示規格" subtitle="24px 網格 · 2px 線寬 · 圓頭端點 · 不填色 · 圖磚只用淺灰底" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.544.0/font/lucide.css"><style>*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:var(--font-sans);color:var(--text-primary);background:var(--surface-page);padding:20px 24px}.lbl{font-size:10px;font-family:var(--font-mono);color:var(--oc-gray-700);letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}.tile{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:var(--radius-icon-tile);background:var(--oc-gray-100);overflow:hidden}.tile i{font-size:22px;line-height:1;color:var(--oc-gray-700);display:flex;align-items:center;justify-content:center;width:100%;height:100%}</style></head><body>
<div style="display:flex;align-items:center;gap:36px">
<div style="position:relative;width:132px;height:132px;flex:0 0 auto;border:1px dashed var(--border-strong);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(0deg,transparent,transparent 21px,var(--oc-gray-100) 21px,var(--oc-gray-100) 22px),repeating-linear-gradient(90deg,transparent,transparent 21px,var(--oc-gray-100) 21px,var(--oc-gray-100) 22px)"><i class="icon-ticket" style="font-size:88px;height:88px"></i></div>
<div style="display:flex;flex-direction:column;gap:11px;font-size:13px;line-height:1.5">
<div style="display:flex;gap:16px"><span style="width:170px;color:var(--oc-gray-700);flex:0 0 auto">網格 Grid</span><strong style="font-weight:600">24 × 24 px</strong></div><div style="display:flex;gap:16px"><span style="width:170px;color:var(--oc-gray-700);flex:0 0 auto">線寬 Stroke</span><strong style="font-weight:600">2 px，任何尺寸都不變</strong></div><div style="display:flex;gap:16px"><span style="width:170px;color:var(--oc-gray-700);flex:0 0 auto">端點 Caps / joins</span><strong style="font-weight:600">圓頭 round</strong></div><div style="display:flex;gap:16px"><span style="width:170px;color:var(--oc-gray-700);flex:0 0 auto">填色 Fill</span><strong style="font-weight:600">無，一律 currentColor 描邊</strong></div><div style="display:flex;gap:16px"><span style="width:170px;color:var(--oc-gray-700);flex:0 0 auto">來源 Source</span><strong style="font-weight:600">Lucide（開源 ISC，icon-*／SVG）</strong></div>
</div></div>
<div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border-default)"><p class="lbl">圖磚 Icon tile — 淺灰底 + 淺灰圖示，48px、8px 圓角，圖示置中</p>
<div style="display:flex;align-items:center;gap:14px">
<span class="tile"><i class="icon-user-plus"></i></span><span class="tile"><i class="icon-chart-column"></i></span><span class="tile"><i class="icon-ticket"></i></span>
<span style="display:inline-flex;gap:12px;padding:8px 12px;border-radius:12px;background:#3D3D3D"><span class="tile" style="background:rgba(255,255,255,.08)"><i class="icon-gift" style="color:rgba(255,255,255,.58)"></i></span><span class="tile" style="background:rgba(255,255,255,.08)"><i class="icon-store" style="color:rgba(255,255,255,.58)"></i></span></span>
<span style="margin-left:6px;font-size:13px;line-height:1.7;color:var(--oc-gray-700);max-width:300px"><strong style="color:var(--text-primary);font-weight:700">不可以出現品牌黃底（#FFEA00）或淺黃底（#FFF8C8）的 icon</strong>——黃色在簡報上是點綴，一整排黃方塊會把版面的重點吃光。表格裡的 32px 黃色勾選圓點是唯一例外，那是勾選記號不是圖磚。多數情況不加圖磚，直接用裸圖示。</span>
</div></div>
</body></html>
